name: Feature request
description: Suggest a new capability or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Before submitting, please search
        [existing issues](https://github.com/Leviosa-AI/klaude/issues?q=is%3Aissue)
        to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's the friction you're hitting that klaude could address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        A specific change, command, or behavior you'd like to see.
        Concrete is better than abstract.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you didn't pick them.

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - New translation backend
        - TUI / popup detection
        - Glossary / token handling
        - CLI subcommand
        - Config / setup
        - Docs
        - Other
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, links, related issues, etc.
