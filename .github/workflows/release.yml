name: Release

# Publishes to npm when a version tag (v*) is pushed.
# Flow: merge to main -> `git tag vX.Y.Z && git push --tags` -> this runs.
#
# Auth: npm Trusted Publishing (OIDC) — no NPM_TOKEN needed. Requires a
# Trusted Publisher to be configured on the npm package pointing at this
# repo + workflow file (release.yml). Provenance is generated automatically
# and requires the source repo to be PUBLIC.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.1)"
        required: true

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing + provenance

jobs:
  publish:
    name: publish to npm
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # resolves to >= 22.14, required for trusted publishing
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.x.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          REF_TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if [ "$PKG_VERSION" != "$REF_TAG" ]; then
            echo "Tag ($REF_TAG) does not match package.json version ($PKG_VERSION)" >&2
            exit 1
          fi

      # OIDC trusted publishing: no token. prepublishOnly re-runs
      # check + typecheck + test + build before packing. access:public
      # comes from publishConfig in package.json; provenance is automatic.
      - name: Publish
        run: npm publish
