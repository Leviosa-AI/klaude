name: Release

# Publishes to npm when a version tag (v*) is pushed.
# Flow: merge to main -> `git tag vX.Y.Z && git push --tags` -> this runs.
#
# Requires repo secret NPM_TOKEN (npm "Automation" token).
# Runs on macOS to match ci.yml, since the test suite is only verified there.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.1)"
        required: true

permissions:
  contents: read
  id-token: write # enables npm provenance for the public package

jobs:
  publish:
    name: publish to npm
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          REF_TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if [ "$PKG_VERSION" != "$REF_TAG" ]; then
            echo "Tag ($REF_TAG) does not match package.json version ($PKG_VERSION)" >&2
            exit 1
          fi

      # `prepublishOnly` runs check + typecheck + test + build before packing.
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
